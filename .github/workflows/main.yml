name: Apply reviewed Prisma migrations to Neon

on:
  push:
    branches:
      - main

# Serialize database jobs so two pushes cannot migrate Neon concurrently.
concurrency:
  group: neon-production-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prisma:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Build and test before database changes
        run: |
          npm run build
          npm test -- --runInBand

      # Apply versioned SQL only; never infer destructive changes from the schema.
      - name: Apply reviewed migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify deployed schema
        run: npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
